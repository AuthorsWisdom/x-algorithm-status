name: Daily readings
on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC, 6 AM Central, after xAI's nightly sync commit
  workflow_dispatch:
permissions:
  contents: write
jobs:
  readings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/status.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit status
        run: |
          git config user.name "tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status.json data/
          git diff --cached --quiet && echo "no change" || git commit -m "readings $(date -u +%F)"
          git push
